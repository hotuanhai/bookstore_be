spring.application.name=backend

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=update
spring.data.rest.base-path=/api

# JWT secret key
security.jwt.secret-key =${JWT_SECRET_KEY}
#security.jwt.expiration-time=3600000
#fortest 3month
security.jwt.expiration-time=7776000000
security.jwt.refresh-expiration-time=604800000

#
# Mail properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SUPPORT_EMAIL}
spring.mail.password=${APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#stripe
payment.stripe.secret-key=${STRIPE_SECRET_KEY}
payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
payment.stripe.successUrl=http://localhost:3000/payment/success
payment.stripe.cancelUrl=http://localhost:3000/payment/cancel

spring.config.import=optional:file:.env[.properties]